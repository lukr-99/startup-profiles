name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  SOLUTION_PATH: StartupProfiles.slnx

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore $env:SOLUTION_PATH --nologo

      - name: Check formatting
        run: dotnet format $env:SOLUTION_PATH --verify-no-changes --no-restore

      - name: Build
        run: dotnet build $env:SOLUTION_PATH -c Release --no-restore --nologo

      - name: Test
        run: >-
          dotnet test $env:SOLUTION_PATH -c Release --no-build --nologo
          --logger "trx;LogFilePrefix=tests"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults/
          if-no-files-found: warn
