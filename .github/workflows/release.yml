name: Release

# Cut a release by pushing a tag like v0.2.0. This publishes a self-contained build, zips it, and
# attaches StartupProfiles-<version>-win-x64.zip to a GitHub Release. The version is derived from the
# tag and stamped into the assembly via -p:Version, so releases are versioned from the tag alone.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test
        run: dotnet test StartupProfiles.slnx -c Release

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish src/StartupProfiles.App/StartupProfiles.App.csproj
          -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      # Sign before zipping. A zip carries no signature of its own, so the executables inside are
      # the only thing SmartScreen can check once the user extracts them.
      # Until a certificate exists this warns and continues; once WINDOWS_CERT_PFX_BASE64 is set it
      # signs and verifies. Add -Require then. See CodePrint docs/release-signing.md.
      - name: Sign executables
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: >-
          ./tools/sign-windows-artifacts.ps1
          -Path 'publish/StartupProfiles*.exe'
          -Description 'Startup Profiles'
          -DescriptionUrl 'https://github.com/lukr-99/startup-profiles'

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath StartupProfiles-${{ steps.ver.outputs.version }}-win-x64.zip

      - name: Report signing status
        if: always()
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path 'publish/StartupProfiles*.exe' -ErrorAction SilentlyContinue
          foreach ($file in $files) {
            $status = (Get-AuthenticodeSignature -LiteralPath $file.FullName).Status
            "- $($file.Name): $status" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: StartupProfiles-${{ steps.ver.outputs.version }}-win-x64.zip
          generate_release_notes: true
