name: Release

# Cut a release by pushing a tag like v0.2.0. This publishes a self-contained build, signs it, and
# attaches to a GitHub Release: StartupProfiles-Setup-<version>.exe (the Inno installer the in-app
# updater downloads) and StartupProfiles-<version>-win-x64.zip, each with a .sha256 checksum. The tag
# must match VersionPrefix in Directory.Build.props, and the version is stamped into the assembly via
# -p:Version. The updater reads releases/latest, so the repository's releases must be public.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # DotNetLib packages come from GitHub Packages, which needs a token even to read. The secret is a
  # classic PAT with read:packages (see nuget.config and dotnetlib's README).
  NuGetPackageSourceCredentials_dotnetlib: Username=lukr-99;Password=${{ secrets.DOTNETLIB_PACKAGES_TOKEN }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate tag and project version
        id: ver
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}' -replace '^v', ''
          [xml]$props = Get-Content -Raw -LiteralPath Directory.Build.props
          $projectVersion = @($props.Project.PropertyGroup.VersionPrefix | Where-Object { $_ })[0]
          if (-not $projectVersion) { throw 'Directory.Build.props has no <VersionPrefix>.' }
          if ($projectVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match project version $projectVersion."
          }
          "version=$tagVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test
        run: dotnet test StartupProfiles.slnx -c Release

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish src/StartupProfiles.App/StartupProfiles.App.csproj
          -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      # Sign before zipping. A zip carries no signature of its own, so the executables inside are
      # the only thing SmartScreen can check once the user extracts them.
      # Until a certificate exists this warns and continues; once WINDOWS_CERT_PFX_BASE64 is set it
      # signs and verifies. Add -Require then. See docs/release-signing.md.
      - name: Sign executables
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: >-
          ./tools/sign-windows-artifacts.ps1
          -Path 'publish/StartupProfiles*.exe'
          -Description 'Startup Profiles'
          -DescriptionUrl 'https://github.com/lukr-99/startup-profiles'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress }

      # Built from the signed publish folder, so the installed executables carry the signature too.
      - name: Build installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version '${{ steps.ver.outputs.version }}' -PublishDir publish -NoChecksum

      - name: Sign installer
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: >-
          ./tools/sign-windows-artifacts.ps1
          -Path 'installer/dist/StartupProfiles-Setup-*.exe'
          -Description 'Startup Profiles Setup'
          -DescriptionUrl 'https://github.com/lukr-99/startup-profiles'

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath StartupProfiles-${{ steps.ver.outputs.version }}-win-x64.zip

      # Same shape as sha256sum output: "<hash>  <file name>", so `sha256sum -c` can check it.
      # Written after signing, so each hash matches the file users download. The updater refuses an
      # installer whose hash does not match its .sha256.
      - name: Write checksums
        shell: pwsh
        run: |
          $setup = 'installer/dist/StartupProfiles-Setup-${{ steps.ver.outputs.version }}.exe'
          Copy-Item -LiteralPath $setup -Destination .
          foreach ($file in @('StartupProfiles-${{ steps.ver.outputs.version }}-win-x64.zip', (Split-Path $setup -Leaf))) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$PWD/$file.sha256", "$hash  $file`n")
          }

      - name: Report signing status
        if: always()
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path 'publish/StartupProfiles*.exe', 'installer/dist/*.exe' -ErrorAction SilentlyContinue)
          foreach ($file in $files) {
            $status = (Get-AuthenticodeSignature -LiteralPath $file.FullName).Status
            "- $($file.Name): $status" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            StartupProfiles-Setup-${{ steps.ver.outputs.version }}.exe
            StartupProfiles-Setup-${{ steps.ver.outputs.version }}.exe.sha256
            StartupProfiles-${{ steps.ver.outputs.version }}-win-x64.zip
            StartupProfiles-${{ steps.ver.outputs.version }}-win-x64.zip.sha256
          generate_release_notes: true
